<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
      .bar { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 500; }
      .text { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 12px; fill: #e6edf3; }
      .muted { fill: #6e7681; }
      .prompt { fill: #58a6ff; font-weight: bold; }
      .cmd { fill: #f0f6fc; }
      .crit { fill: #ff7b72; font-weight: bold; }
      .high { fill: #ffa657; font-weight: bold; }
      .green { fill: #7ee787; font-weight: bold; }
      .cyan { fill: #79c0ff; }
      .rule { fill: #d2a8ff; font-weight: bold; }
      .loc { fill: #8b949e; text-decoration: underline; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="880" height="430" class="bg" />
  
  <!-- Titlebar -->
  <path d="M 0,8 A 8,8 0 0,1 8,0 L 872,0 A 8,8 0 0,1 880,8 L 880,36 L 0,36 Z" class="bar" />
  <circle cx="20" cy="18" r="6" fill="#ff5f56" />
  <circle cx="38" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="6" fill="#27c93f" />
  <text x="440" y="22" text-anchor="middle" class="title">strata  -  bash  -  880x430</text>

  <!-- Terminal Content -->
  <g transform="translate(24, 62)">
    <!-- Command Invocation -->
    <text x="0" y="0" class="text">
      <tspan class="prompt">$</tspan> <tspan class="cmd">strata scan ./infrastructure --rules-dir ./rules</tspan>
    </text>

    <!-- Header -->
    <text x="0" y="24" class="text" fill="#8b949e">STRATA // Infrastructure-as-Code &amp; Cloud Security Audit</text>
    <text x="0" y="38" class="text muted">====================================================================================</text>

    <!-- Finding 1: Critical S3 -->
    <text x="0" y="62" class="text">
      <tspan class="muted">#1</tspan> <tspan class="crit">[CRITICAL]</tspan> <tspan class="rule">AWS-CIS-S3-001</tspan> :: S3 Bucket allows public read/write access
    </text>
    <text x="24" y="80" class="text">
      <tspan class="muted">Location: </tspan><tspan class="loc">terraform/storage.tf:3:6</tspan>
      <tspan class="muted">  Standard: </tspan><tspan class="cyan">CIS AWS 1.4 § 2.1.1</tspan>
    </text>
    <text x="24" y="98" class="text">
      <tspan class="muted">Remedy:   </tspan><tspan class="green">Set 'acl = "private"' and enforce S3 Public Access Block.</tspan>
    </text>

    <!-- Finding 2: Critical SG -->
    <text x="0" y="130" class="text">
      <tspan class="muted">#2</tspan> <tspan class="crit">[CRITICAL]</tspan> <tspan class="rule">AWS-CIS-SG-001</tspan> :: Security Group ingress 0.0.0.0/0 on port 22 (SSH)
    </text>
    <text x="24" y="148" class="text">
      <tspan class="muted">Location: </tspan><tspan class="loc">terraform/network.tf:8:22</tspan>
      <tspan class="muted"> Standard: </tspan><tspan class="cyan">CIS AWS 1.4 § 5.2</tspan>
    </text>
    <text x="24" y="166" class="text">
      <tspan class="muted">Remedy:   </tspan><tspan class="green">Restrict CIDR blocks to corporate VPN gateway or bastion subnet.</tspan>
    </text>

    <!-- Finding 3: High Docker -->
    <text x="0" y="198" class="text">
      <tspan class="muted">#3</tspan> <tspan class="high">[HIGH]    </tspan> <tspan class="rule">DOCKER-CIS-4.1</tspan> :: Container image configured to run as root user
    </text>
    <text x="24" y="216" class="text">
      <tspan class="muted">Location: </tspan><tspan class="loc">docker/Dockerfile:17:1</tspan>
      <tspan class="muted">   Standard: </tspan><tspan class="cyan">CIS Docker 1.3.1 § 4.1</tspan>
    </text>
    <text x="24" y="234" class="text">
      <tspan class="muted">Remedy:   </tspan><tspan class="green">Add explicit non-root user: 'USER 10001:10001' before CMD/ENTRYPOINT.</tspan>
    </text>

    <!-- Finding 4: Sandboxed Lua Custom Rule -->
    <text x="0" y="266" class="text">
      <tspan class="muted">#4</tspan> <tspan class="high">[MEDIUM]  </tspan> <tspan class="rule">LUA-TAG_ENFORCE</tspan> :: S3 bucket missing required 'Environment' tag
    </text>
    <text x="24" y="284" class="text">
      <tspan class="muted">Location: </tspan><tspan class="loc">terraform/storage.tf:3:6</tspan>
      <tspan class="muted">  Standard: </tspan><tspan class="cyan">Custom Policy (rules/tag_enforce.lua)</tspan>
    </text>

    <!-- Summary line -->
    <text x="0" y="318" class="text muted">------------------------------------------------------------------------------------</text>
    <text x="0" y="338" class="text">
      <tspan fill="#f0f6fc" font-weight="bold">Audit Summary:</tspan> 4 violations found (<tspan class="crit">2 Critical</tspan>, <tspan class="high">1 High</tspan>, <tspan fill="#d29922">1 Medium</tspan>)
    </text>
    <text x="0" y="356" class="text">
      <tspan class="green">[+] Scanned 18 infrastructure files in 3.42 ms</tspan> <tspan class="muted">| Exit Code 1 (CI Gate Enforced)</tspan>
    </text>
  </g>
</svg>
