[package]
name = "strata"
version = "0.1.1"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
colored = "2.1"
walkdir = "2.5"
regex = "1.10"
sha2 = "0.10"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
axum = "0.7"
tokio = { version = "1.38", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
notify-rust = "4.11"


